# Archive the VoxClaw iOS app + widget extension and upload to TestFlight when an
# ios tag is pushed.
# Usage: git tag ios-v1.0.0 && git push origin ios-v1.0.0
#
# Uses MANUAL signing driven by an Apple Distribution cert + App Store provisioning
# profiles (Xcode automatic signing with an ASC API key is broken on the Xcode beta
# used locally — see memory ios-testflight-signing).
#
# Required repo secrets (all base64 values produced with: base64 -i <file>):
#   IOS_DIST_CERT_P12_BASE64    - base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD      - password for that .p12
#   IOS_APPSTORE_PROFILE_BASE64 - base64 of the app's IOS_APP_STORE .mobileprovision
#   IOS_WIDGET_PROFILE_BASE64   - base64 of the widget's IOS_APP_STORE .mobileprovision
#   ASC_API_KEY_P8_BASE64       - base64 of the App Store Connect API key .p8
#   ASC_KEY_ID                  - App Store Connect API Key ID
#   ASC_ISSUER_ID               - App Store Connect Issuer ID
#
# NOTE: the app targets iOS 26, so the runner needs an Xcode with the iOS 26 SDK
# (Xcode 26+). Until GitHub's hosted images ship it, this job will fail at archive
# time and the documented local path (Scripts / asc) remains the fallback.

name: iOS TestFlight

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & Upload to TestFlight
    runs-on: macos-latest
    env:
      PROJECT: VoxClawIOS/VoxClawIOS.xcodeproj
      SCHEME: VoxClawIOS
      APP_PROFILE_NAME: VoxClaw iOS AppStore
      WIDGET_PROFILE_NAME: VoxClaw Widgets AppStore
      TEAM_ID: X2RKZ5TG99
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight (require signing secrets)
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=0
          for v in IOS_DIST_CERT_P12_BASE64 ASC_API_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!v:-}" ]]; then echo "::error::missing secret $v"; missing=1; fi
          done
          [[ $missing -eq 0 ]] || { echo "iOS signing secrets not configured; aborting."; exit 1; }

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Import Apple Distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import dist.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain >/dev/null
          rm -f dist.p12

      - name: Install provisioning profiles
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          PP="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP"
          for pair in "app:$IOS_APPSTORE_PROFILE_BASE64" "widget:$IOS_WIDGET_PROFILE_BASE64"; do
            name="${pair%%:*}"; b64="${pair#*:}"
            echo "$b64" | base64 --decode > "$name.mobileprovision"
            uuid=$(security cms -D -i "$name.mobileprovision" | plutil -extract UUID raw -o - -)
            cp "$name.mobileprovision" "$PP/$uuid.mobileprovision"
            echo "installed $name -> $uuid"
          done

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        run: |
          # Keep build numbers monotonic and clear of locally-uploaded builds.
          BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VoxClawIOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export App Store IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.malpern.voxclaw</key><string>${APP_PROFILE_NAME}</string>
              <key>com.malpern.voxclaw.widgets</key><string>${WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VoxClawIOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP/export/VoxClawIOS.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # altool uploads but does NOT distribute. Internal testers only see builds
      # linked to their group, so wait for processing and add the build to the
      # Internal Testers group. Best-effort: a failure here doesn't fail the run.
      - name: Distribute to internal testers
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APP_ID: "6759539001"
          INTERNAL_GROUP_ID: "356ad380-9fca-4e1a-9abd-0fa18a8bed9b"
        run: |
          brew install asc
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$ASC_PRIVATE_KEY_PATH"
          # Wait for the just-uploaded build to finish processing, then link it.
          asc builds wait --app "$APP_ID" --build-number "$BUILD_NUMBER" --platform IOS || true
          asc builds add-groups --app "$APP_ID" --build-number "$BUILD_NUMBER" \
            --platform IOS --group "$INTERNAL_GROUP_ID"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 || true
          security delete-keychain build.keychain || true
